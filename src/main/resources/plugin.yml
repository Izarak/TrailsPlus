name: TrailsPlus
version: '${version}'

main: me.izarak.trailsPlus.TrailsPlus
api-version: '1.21'

commands:
  trailsplus:
    description: Toggle player trails.
    usage: /trailsplus <trail>
    permission: trailsplus.trail.player
    aliases: [trails, trail]
  projectiletrails:
    description: Toggle projectile trails.
    usage: /projectiletrails <trail>
    permission: trailsplus.trail.projectile
    aliases: [ptrails, ptrail]
